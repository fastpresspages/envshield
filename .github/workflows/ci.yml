name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: envshield-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify zero runtime dependencies
        run: |
          node -e "const p = require('./package.json'); if (p.dependencies && Object.keys(p.dependencies).length > 0) { console.error('Error: Runtime dependencies forbidden!'); process.exit(1); } console.log('Zero runtime dependencies verified.');"
      - name: Run unit tests
        run: npm test
      - name: Test CLI smoke commands
        run: |
          node bin/envshield.js --help
          node bin/envshield.js --version
          node bin/envshield.js audit . || true
